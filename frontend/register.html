<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobSphere - Register</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            JobSphere
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-header">

                <h1>Create Account</h1>

                <p class="auth-subtitle">
                    Join JobSphere and start your journey
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="role">
                        Register As
                    </label>

                    <select id="role" required>

                        <option value="">
                            Select your role
                        </option>

                        <option value="CANDIDATE">
                            Candidate
                        </option>

                        <option value="RECRUITER">
                            Recruiter
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn primary full-width"
                >
                    Create Account
                </button>

            </form>


            <p
                id="registerMessage"
                class="message"
                aria-live="polite"
            ></p>


            <!-- <div class="auth-divider">
                <span>OR</span>
            </div> -->


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </section>

    </main>


    <footer>

        <p>
            © 2026 JobSphere. All rights reserved.
        </p>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>
